[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maelys-egress"
version = "0.14.0"
description = "Dependency-free process SDK for the Maelys Egress mediator"
requires-python = ">=3.9"
license = {text = "MPL-2.0"}

[tool.setuptools.packages.find]
where = ["src"]
