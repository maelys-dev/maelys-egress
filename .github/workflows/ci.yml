name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04-arm
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: macos-15
            cc: clang
            cxx: clang++
          - os: macos-26
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: scripts/checkout-system.sh
      - run: scripts/checkout-cli.sh
      - name: Install tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang gcc g++
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: make check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Release socle drift
        if: matrix.os == 'ubuntu-24.04' && matrix.cc == 'clang'
        run: |
          set -euo pipefail
          sha="$(sed -n 's|.*maelys-release/.github/workflows/release.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/release.yml)"
          test -n "$sha"
          git clone -q https://github.com/maelys-dev/maelys-release.git "$RUNNER_TEMP/maelys-release"
          git -C "$RUNNER_TEMP/maelys-release" checkout -q "$sha"
          "$RUNNER_TEMP/maelys-release/scripts/adopt.sh" . --product maelys-egress --check
      - name: Require arm64 archive
        if: runner.os == 'macOS'
        run: test "$(lipo -archs build/release/lib/libmaelys_egress.a)" = arm64

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: scripts/checkout-system.sh
      - run: scripts/checkout-cli.sh
      - run: sudo apt-get update && sudo apt-get install -y clang g++ libclang-rt-18-dev
      - run: make asan-ubsan
      - run: make tsan
      - run: make fuzz

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: scripts/checkout-system.sh
      - run: scripts/checkout-cli.sh
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang g++
      - run: make mutation-check

  tls-providers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: scripts/checkout-system.sh
      - run: scripts/checkout-cli.sh
      - name: Install TLS development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang g++ pkg-config libmbedtls-dev libwolfssl-dev
      - name: Install TLS development packages
        if: runner.os == 'macOS'
        run: brew install mbedtls wolfssl
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: make tls-providers-check tls-binaries CC=clang CXX=clang++
      - name: Verify optional installation surface
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          make DESTDIR="$stage" install-tls-modules CC=clang CXX=clang++
          test -f "$stage/usr/local/include/maelys/egress_tls_modules.h"
          test -x "$stage/usr/local/bin/maelys-egress-mbedtls"
          test -x "$stage/usr/local/bin/maelys-egress-wolfssl"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Measured: a layer cache brings this job from 41 s to 37 s warm and
      # 117 s cold, so the plain build stays.
      - run: docker build -f docker/Dockerfile.test -t maelys-egress-test .
      - run: docker run --rm maelys-egress-test

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: scripts/checkout-system.sh
      - run: scripts/checkout-cli.sh
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential dpkg-dev file rpm
      - run: PACKAGE_VERSION_OVERRIDE=0.0.0 bash scripts/package-release.sh ${{ matrix.target }}
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --contents dist/maelys-egress_0.0.0_*.deb | grep -q '/usr/bin/maelys-egress'
          rpm -qpl dist/maelys-egress-0.0.0-1.*.rpm | grep -q '/usr/include/maelys/egress.h'
