name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The socle's product CI: the same checkouts and packages as the release,
  # `make check` on the three release targets and the socle drift check.
  # Sanitizers, mutation, TLS providers, Docker and packaging stay below.
  socle:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@6b4700b2b50c9475b2ca5d67398c0f3278ecbcbe # v0.23.0
    with:
      product: maelys-egress
      sanitizer_command: ""
      # The socle's job replays the committed corpus, which is what it says it
      # is for; the libFuzzer campaign stays below because that job installs no
      # compiler runtime for it.
      fuzz_command: make fuzz-smoke

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04-arm
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: macos-15
            cc: clang
            cxx: clang++
          - os: macos-26
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/checkout-dependency.sh maelys-system
      - run: sh scripts/checkout-dependency.sh maelys-cli
      - run: sh scripts/checkout-dependency.sh agent-cli-spec
      - name: Install tools
        if: runner.os == 'Linux'
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y clang gcc g++
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: make check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Require arm64 archive
        if: runner.os == 'macOS'
        run: test "$(lipo -archs build/release/lib/libmaelys_egress.a)" = arm64

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/checkout-dependency.sh maelys-system
      - run: sh scripts/checkout-dependency.sh maelys-cli
      - run: sh scripts/checkout-dependency.sh agent-cli-spec
      - run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y clang g++ libclang-rt-18-dev
      - run: make asan-ubsan
      - run: make tsan
      - run: make fuzz

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/checkout-dependency.sh maelys-system
      - run: sh scripts/checkout-dependency.sh maelys-cli
      - run: sh scripts/checkout-dependency.sh agent-cli-spec
      - run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y build-essential clang g++
      - run: make mutation-check

  tls-providers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/checkout-dependency.sh maelys-system
      - run: sh scripts/checkout-dependency.sh maelys-cli
      - run: sh scripts/checkout-dependency.sh agent-cli-spec
      - name: Install TLS development packages
        if: runner.os == 'Linux'
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y clang g++ pkg-config libmbedtls-dev libwolfssl-dev
      - name: Install TLS development packages
        if: runner.os == 'macOS'
        run: brew install mbedtls wolfssl
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: make tls-providers-check tls-binaries CC=clang CXX=clang++
      - name: Verify optional installation surface
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          make DESTDIR="$stage" install-tls-modules CC=clang CXX=clang++
          test -f "$stage/usr/local/include/maelys/egress_tls_modules.h"
          test -x "$stage/usr/local/bin/maelys-egress-mbedtls"
          test -x "$stage/usr/local/bin/maelys-egress-wolfssl"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Measured: a layer cache brings this job from 41 s to 37 s warm and
      # 117 s cold, so the plain build stays.
      - run: docker build -f docker/Dockerfile.test -t maelys-egress-test .
      - run: docker run --rm maelys-egress-test

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/checkout-dependency.sh maelys-system
      - run: sh scripts/checkout-dependency.sh maelys-cli
      - run: sh scripts/checkout-dependency.sh agent-cli-spec
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y build-essential dpkg-dev file rpm
      - run: PACKAGE_VERSION_OVERRIDE=0.0.0 bash scripts/package-release.sh ${{ matrix.target }}
      - run: sh scripts/check-installed-system.sh
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --contents dist/maelys-egress_0.0.0_*.deb | grep -q '/usr/bin/maelys-egress'
          rpm -qpl dist/maelys-egress-0.0.0-1.*.rpm | grep -q '/usr/include/maelys/egress.h'
