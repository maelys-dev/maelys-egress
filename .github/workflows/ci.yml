name: ci

on:
  # Without a branch filter, every push of a pull request runs this twice:
  # once for the push and once for the pull_request. maelys-release advises
  # the filter, which leaves one run per pull request and one per push to main.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The socle's product CI: the same checkouts and packages as the release,
  # `make check` on the three release targets and the socle drift check.
  # Sanitizers, mutation, TLS providers, Docker and packaging stay below.
  socle:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@18ff37d4acce34b01a9371be4ccb4f38b812d9c8 # v0.63.1
    with:
      product: maelys-egress
      sanitizer_command: ""
      # Both targets run there since 0.25.1 gave that job the compiler
      # runtime: the corpus replay, then the bounded run the conventions
      # place in CI. A focused bootstrap gate also runs on macOS below.
      fuzz_command: make fuzz-smoke fuzz bootstrap-fuzz-check

  # Every job below is bounded. A job without a bound runs until GitHub's own
  # limit of six hours: two of them sat for an hour in `apt-get update`, on a
  # mirror that had stopped answering, until they were cancelled by hand.
  # That step has its own bound of two minutes since; this one is for
  # whatever else stops answering.
  # Over thirty green runs no job but `docker` took more than 4 minutes, and
  # `docker`, whose image builds download their packages, took up to 26:
  # hence 20 minutes, and 45 for it. The `socle` job calls a reusable
  # workflow, which a caller cannot bound: its legs have the bound the socle
  # gives them.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04-arm
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: macos-15
            cc: clang
            cxx: clang++
          - os: macos-26
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - name: Install tools
        if: runner.os == 'Linux'
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages, and a mirror that stops answering
          # must not hold the job: the update is stopped after two minutes, it
          # reports, and the install decides with the lists the image has.
          sudo timeout --kill-after=10 120 apt-get update || echo "::warning::apt-get update did not finish or reported errors; the install decides"
          sudo apt-get install -y clang gcc g++ fish zsh
      # macOS ships zsh and bash and no fish: without it the conformance kit
      # skips the fish completion script on every macOS job.
      - name: Install fish
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: make check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Require arm64 archive
        if: runner.os == 'macOS'
        run: test "$(lipo -archs build/release/lib/libmaelys_egress.a)" = arm64
      - name: Bootstrap-only mutation and fuzz gate on macOS
        if: matrix.os == 'macos-15'
        run: |
          # Apple Clang does not ship libFuzzer. Use the matching LLVM linker
          # too: Xcode 16's ld cannot link LLVM 23 sanitizer-coverage objects.
          # This toolchain is confined to fuzz, never the product build.
          brew install llvm lld
          make bootstrap-mutation-check
          make bootstrap-fuzz-check BOOTSTRAP_FUZZ_CC="$(brew --prefix llvm)/bin/clang" \
            BOOTSTRAP_FUZZ_CXX="$(brew --prefix llvm)/bin/clang++" \
            BOOTSTRAP_FUZZ_LDFLAGS="--ld-path=$(brew --prefix lld)/bin/ld64.lld"

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages, and a mirror that stops answering
          # must not hold the job: the update is stopped after two minutes, it
          # reports, and the install decides with the lists the image has.
          sudo timeout --kill-after=10 120 apt-get update || echo "::warning::apt-get update did not finish or reported errors; the install decides"
          sudo apt-get install -y clang g++ libclang-rt-18-dev fish zsh
      - run: make asan-ubsan
      - run: make tsan

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages, and a mirror that stops answering
          # must not hold the job: the update is stopped after two minutes, it
          # reports, and the install decides with the lists the image has.
          sudo timeout --kill-after=10 120 apt-get update || echo "::warning::apt-get update did not finish or reported errors; the install decides"
          sudo apt-get install -y build-essential clang g++
      - run: make mutation-check

  tls-providers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - name: Install TLS development packages
        if: runner.os == 'Linux'
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages, and a mirror that stops answering
          # must not hold the job: the update is stopped after two minutes, it
          # reports, and the install decides with the lists the image has.
          sudo timeout --kill-after=10 120 apt-get update || echo "::warning::apt-get update did not finish or reported errors; the install decides"
          sudo apt-get install -y clang g++ pkg-config libmbedtls-dev libwolfssl-dev
      - name: Install TLS development packages
        if: runner.os == 'macOS'
        run: brew install mbedtls wolfssl
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: make tls-providers-check tls-binaries CC=clang CXX=clang++
      - name: Require provider tests to catch the original Unix receive bypass
        run: make tls-provider-mutation-check CC=clang CXX=clang++
      - name: Sanitize TLS providers and adversarial Unix transport tests
        run: make BUILD_PROFILE=tls-sanitized SANITIZE_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tls-providers-check CC=clang CXX=clang++
      - name: Verify optional installation surface
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          make DESTDIR="$stage" install-tls-modules CC=clang CXX=clang++
          test -f "$stage/usr/local/include/maelys/egress_tls_modules.h"
          test -x "$stage/usr/local/bin/maelys-egress-mbedtls"
          test -x "$stage/usr/local/bin/maelys-egress-wolfssl"

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Materialize pinned dependencies for the deployment image
        run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      # Measured: a layer cache brings this job from 41 s to 37 s warm and
      # 117 s cold, so the plain build stays.
      - run: docker build -f docker/Dockerfile.test -t maelys-egress-test .
      - run: docker run --rm maelys-egress-test
      - name: Exercise the networkless Compose deployment
        env:
          MAELYS_EGRESS_IMAGE: maelys-egress-sidecar:compose-test
        run: make compose-proxy-check
      - name: Exercise the networkless native channel deployment
        run: make compose-channel-check

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages, and a mirror that stops answering
          # must not hold the job: the update is stopped after two minutes, it
          # reports, and the install decides with the lists the image has.
          sudo timeout --kill-after=10 120 apt-get update || echo "::warning::apt-get update did not finish or reported errors; the install decides"
          sudo apt-get install -y build-essential dpkg-dev file rpm fish zsh
      # The packaging script runs `make check`, as the release build does
      # with the packages `dependencies/packages` declares for macOS.
      - name: Install fish
        if: runner.os == 'macOS'
        run: brew install fish
      - run: PACKAGE_VERSION_OVERRIDE=0.0.0 bash scripts/package-release.sh ${{ matrix.target }}
      - run: sh scripts/check-installed-system.sh
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --contents dist/maelys-egress_0.0.0_*.deb | grep -q '/usr/bin/maelys-egress'
          rpm -qpl dist/maelys-egress-0.0.0-1.*.rpm | grep -q '/usr/include/maelys/egress.h'
      # Listing a package says what it holds. Installing it in a clean
      # container of its distribution, and running what was installed, says
      # that it installs and that the manifest names the installed binary.
      - name: Install the Linux packages and use what they installed
        if: runner.os == 'Linux'
        run: sh scripts/check-installed-packages.sh dist 0.0.0
