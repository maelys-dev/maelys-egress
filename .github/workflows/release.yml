name: release

# Managed by maelys-release v0.65.0 (0.65.0). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@c1a60c56025f0d9530da2c605136d554844e8f23 # v0.65.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      linux_packages: build-essential dpkg-dev file rpm fish zsh
      macos_packages: fish

  tap-maelys-egress:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@c1a60c56025f0d9530da2c605136d554844e8f23 # v0.65.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT maelys-egress
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
