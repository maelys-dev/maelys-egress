name: release

# Managed by maelys-release v0.2.0 (0.2.0). Regenerate with
# scripts/adopt.sh of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@1cf1436d4b8b1efa14ea4c01fa30a755bd9a4641 # v0.2.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      dependency_checkout: |
        scripts/checkout-cli.sh
        scripts/checkout-system.sh

  tap:
    needs: release
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@1cf1436d4b8b1efa14ea4c01fa30a755bd9a4641 # v0.2.0
    permissions:
      contents: write
    with:
      product: maelys-egress
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
