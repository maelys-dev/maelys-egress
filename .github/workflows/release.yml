name: release

# Shared Maelys release mechanics (maelys-dev/maelys-release): signed-tag
# verification, three-target packaging with provenance attestation, GitHub
# release, then the Homebrew formula rendered from this tag and pushed to
# maelys-dev/homebrew-tap when the tap credentials are configured.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@d48ebbb5bc4913d880e51296b2f140ee809bcb14 # v0.1.1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      dependency_checkout: |
        scripts/checkout-system.sh
        scripts/checkout-cli.sh
      linux_packages: build-essential dpkg-dev file rpm
      macos_runner: '"macos-15"'

  tap:
    needs: release
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@d48ebbb5bc4913d880e51296b2f140ee809bcb14 # v0.1.1
    with:
      product: maelys-egress
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
