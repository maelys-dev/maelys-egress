name: release

# Managed by maelys-release v0.2.3 (0.2.3). Regenerate with
# scripts/adopt.sh of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@36453bf0b5c05f3b29f9e22cf66625c97d4de25e # v0.2.3
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      dependency_checkout: |
        scripts/checkout-cli.sh
        scripts/checkout-system.sh

  tap-maelys-egress:
    needs: release
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@36453bf0b5c05f3b29f9e22cf66625c97d4de25e # v0.2.3
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT maelys-egress
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
