name: release

# Managed by maelys-release untagged (0.44.0). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@5694ea650ec7cf061622fc4e7ce935a19ee352df # untagged
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        mkdir -p "$RUNNER_TEMP/dependencies"
        sh scripts/checkout-dependency.sh agent-cli-spec "$RUNNER_TEMP/dependencies/agent-cli-spec"
        sh scripts/checkout-dependency.sh maelys-cli "$RUNNER_TEMP/dependencies/maelys-cli"
        sh scripts/checkout-dependency.sh maelys-system "$RUNNER_TEMP/dependencies/maelys-system"
        echo "MAELYS_DEPENDENCIES_DIR=$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"

  tap-maelys-egress:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@5694ea650ec7cf061622fc4e7ce935a19ee352df # untagged
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT maelys-egress
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
