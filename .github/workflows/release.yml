      dependency_checkout: |
        sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"

  tap-maelys-egress:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@9099776554399fb65f88d7ae2c3ab403d22100ad # untagged
    permissions:
      contents: write
      id-token: write
      attestations: write
