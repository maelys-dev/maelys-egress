name: release

# Managed by maelys-release v0.15.3 (0.15.3). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@148b0979b4ff1af6a4f08ea082b785fcf66fc661 # v0.15.3
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependency.sh maelys-cli
        sh scripts/checkout-dependency.sh maelys-system

  tap-maelys-egress:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@148b0979b4ff1af6a4f08ea082b785fcf66fc661 # v0.15.3
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-egress
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT maelys-egress
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
